# BGP Workshop — MLflow Experiment resource
# The DAB creates this experiment automatically when the bundle is deployed.
# The experiment name uses the deploying user's workspace path, so each
# participant gets their own experiment. Traces are stored in the participant's
# UC schema as Delta tables.

resources:
  experiments:
    bgp_workshop_experiment:
      name: /Users/${workspace.current_user.userName}/bgp_bank_workshop
      tags:
        - key: purpose
          value: bgp_workshop
        - key: product
          value: mlflow_genai
      trace_location:
        uc_trace_location:
          catalog: ${var.uc_catalog}
          schema: ${var.uc_schema}
