# AI Gateway "model service" (Unity Gateway) — a governed route that fronts a
# Databricks foundation model (Claude Sonnet 5) for the banking agent's LLM.
#
# Callers invoke it by its fully-qualified name
#   ${var.uc_catalog}.${var.uc_schema}.${var.participant_prefix}_bank_agent_llm
# via the OpenAI-compatible endpoint https://<host>/ai-gateway/mlflow/v1
# (NOT the /serving-endpoints path used by plain serving endpoints).
resources:
  model_services:
    bank_agent_llm:
      parent: schemas/${var.uc_catalog}.${var.uc_schema}
      model_service_id: ${var.participant_prefix}_bank_agent_llm
      comment: "Governed Claude Sonnet 5 route for the banking customer-support agent."
      config:
        # Log every request/response to a UC Delta table for observability + usage.
        inference_table:
          parent: schemas/${var.uc_catalog}.${var.uc_schema}
          table_name_prefix: ${var.participant_prefix}_bank_agent_llm
        routing:
          destinations:
            - name: primary
              destination_type: DESTINATION_TYPE_PAY_PER_TOKEN_FOUNDATION_MODEL
              pay_per_token_config:
                model: ${var.llm_foundation_model}
              traffic_percentage: 100
