# Banking Agent - Judge Alignment & Prompt Optimization Pipeline

resources:
  jobs:
    alignment_pipeline:
      name: "Banking Agent - Alignment Pipeline"
      description: "Runs Judge Alignment and Prompt Optimization after labeling is complete"

      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: Etc/UTC
        pause_status: PAUSED

      tasks:
        - task_key: judge_alignment
          notebook_task:
            notebook_path: ${var.notebook_root}/5_production_monitoring
            source: WORKSPACE
            # Exact DAB-injected values (incl. the real experiment name — dev-mode
            # deploys rename experiments, so never reconstruct it by string).
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}
              warehouse: ${var.warehouse_id}
              experiment_name: ${resources.experiments.banking_workshop_experiment.name}
          environment_key: default_environment
          timeout_seconds: 7200

        - task_key: prompt_optimization
          depends_on:
            - task_key: judge_alignment
          notebook_task:
            notebook_path: ${var.notebook_root}/6_prompt_optimization
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}
              warehouse: ${var.warehouse_id}
              experiment_name: ${resources.experiments.banking_workshop_experiment.name}
          environment_key: default_environment
          timeout_seconds: 7200

      environments:
        - environment_key: default_environment
          spec:
            client: "1"
