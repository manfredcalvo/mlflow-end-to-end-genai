version: 2.1

# Production deploy path — the CircleCI counterpart of .github/workflows/deploy.yml.
# Kept as a customer-facing example that the same Databricks Asset Bundle works
# with any CI provider: identical steps, identical secrets.
#
# Configure these in CircleCI: Project Settings -> Environment Variables:
#   DATABRICKS_HOST     workspace URL (https://<workspace>.cloud.databricks.com)
#   DATABRICKS_TOKEN    a Databricks access token with deploy rights
#   SQL_WAREHOUSE_ID    SQL warehouse for MLflow tracing
#   NOTEBOOK_ROOT       workspace path of the synced notebooks (prod)
#
# Workshop participants do NOT use this — each participant self-deploys from
# their clone (see workshop/README.md). This pipeline deploys the shared prod
# app on push to main. The frontend is built fresh here (it also verifies the
# app compiles); the committed app/client/build/ is the fallback for CLI-only
# deploys. requirements.txt is committed (source of truth) — no generation steps.

jobs:
  deploy:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout

      - run:
          name: Install Databricks CLI (>= 1.19 for model_services)
          command: |
            # Canonical installer (databricks/setup-cli); sudo writes to
            # /usr/local/bin, which is on PATH — no PATH setup needed.
            curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sudo sh
            databricks --version

      - run:
          name: Configure Databricks auth
          command: |
            mkdir -p ~/.databricks
            printf 'host = %s\ntoken = %s\n' "$DATABRICKS_HOST" "$DATABRICKS_TOKEN" > ~/.databrickscfg

      - run:
          name: Build frontend
          command: |
            cd app/client
            npm install
            npm run build

      - run:
          name: Validate bundle
          command: databricks bundle validate --target prod

      # The deploy sequence mirrors the participant flow (workshop/README.md
      # Phase 1): the data job that creates the <prefix>_bank_* tables is
      # itself created by this bundle, and the Genie space validates that its
      # tables exist — so the job must run between two deploys.
      - run:
          name: Deploy bundle (creates the data job; Genie space defers)
          command: |
            # On the very first prod deploy the Genie space reports an EXPECTED
            # error (its bank tables don't exist yet); every other resource
            # deploys. Subsequent deploys, with the tables already created,
            # complete clean.
            databricks bundle deploy --target prod --auto-approve \
              --var warehouse_id="$SQL_WAREHOUSE_ID" \
              --var notebook_root="$NOTEBOOK_ROOT" \
              || echo "EXPECTED on first deploy: Genie space defers until the data job runs."

      - run:
          name: Run the participant data job (tables, functions, app-SP grants)
          command: |
            # Idempotent: fixed Faker seed regenerates identical data,
            # CREATE OR REPLACE functions, and the app-SP EXECUTE grants.
            databricks bundle run bgp_participant_data --target prod \
              --var warehouse_id="$SQL_WAREHOUSE_ID" \
              --var notebook_root="$NOTEBOOK_ROOT"

      - run:
          name: Deploy again (Genie space + dashboard create cleanly)
          command: |
            databricks bundle deploy --target prod --auto-approve \
              --var warehouse_id="$SQL_WAREHOUSE_ID" \
              --var notebook_root="$NOTEBOOK_ROOT"

      - run:
          name: Deploy and start the app
          command: |
            databricks bundle run bgp_agent --target prod \
              --var warehouse_id="$SQL_WAREHOUSE_ID" \
              --var notebook_root="$NOTEBOOK_ROOT"

workflows:
  deploy:
    jobs:
      - deploy:
          filters:
            branches:
              only: main
